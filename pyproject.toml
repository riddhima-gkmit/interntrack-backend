[project]
name = "fastapi-prac"
version = "0.1.0"
description = "InternTrack backend: multi-tenant internship task tracking API built with FastAPI, PostgreSQL, and Redis."
readme = "README.md"
requires-python = ">=3.13.7"
dependencies = [
    "aiosmtplib>=5.1.0",
    "alembic>=1.13.0",
    "asyncpg>=0.30.0",
    "asyncio>=4.0.0",
    "fastapi>=0.128.0",
    "isort>=7.0.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "pydantic[email]>=2.12.5",
    "pydantic-settings>=2.12.0",
    "redis>=7.1.1",
    "ruff>=0.15.0",
    "sqlalchemy>=2.0.46",
    "uvicorn>=0.40.0",
    "psycopg2-binary>=2.9.11",
]
